# The repo's branch-protection ruleset requires a status check named exactly
# `ci`. The first job below is named `ci` — both the job name and its `name:`
# key — so the check this workflow reports is the one the ruleset gates on.
#
# The workflow deliberately reports TWO checks:
#
#   ci                            required by the ruleset. No secret is involved,
#                                 so nothing in it can silently mask a skip:
#                                 every step either really runs or the job fails.
#   integration-live (informational)
#                                 not required. The live testnet suite signs real
#                                 transactions and needs the deployment's keys,
#                                 which live in the `PHASE2_ENV_FILE` secret.
#                                 Reports passed / skipped / failed as its own
#                                 check — never success for a skip.
#
# They are separate jobs on purpose. The live suite used to be a step inside the
# required job, where a missing secret made it `exit 0`; the required check then
# went green without the enforcement suite ever running. A required check that
# can pass without the security-critical test suite does not mean what a required
# check is supposed to mean.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI inspects the repo and runs tests; it never writes to it.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm test

  # Reports whether the live suite can run at all. This job claims nothing about
  # on-chain behaviour — it only answers "does the credential exist?" and says the
  # answer out loud, so a skipped live suite always has a visible reason.
  secret_presence:
    name: PHASE2_ENV_FILE presence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: check for PHASE2_ENV_FILE
        id: check
        env:
          PHASE2_ENV_FILE: ${{ secrets.PHASE2_ENV_FILE }}
        run: |
          if [ -n "${PHASE2_ENV_FILE:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "PHASE2_ENV_FILE is set — the live testnet suite will run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=live integration suite NOT run::PHASE2_ENV_FILE is not set, so the live testnet suite cannot run. Adding that repository secret is a maintainer action. This is neither a pass nor a test failure."
          fi

  # Informational and never required. Three honest states, as its own check:
  #
  #   passed  — the live suite really ran against the live guard and passed
  #   skipped — no credential; the job does not run and GitHub reports it as
  #             skipped/neutral, NOT as success. `ci` says nothing about it either
  #             way, so a green `ci` never implies the suite ran.
  #   failed  — the live suite really ran and failed
  integration_live:
    name: integration-live (informational)
    needs: secret_presence
    if: needs.secret_presence.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: run the live testnet suite
        env:
          PHASE2_ENV_FILE: ${{ secrets.PHASE2_ENV_FILE }}
        run: |
          printf '%s\n' "$PHASE2_ENV_FILE" > .env.phase2
          npm run test:integration
